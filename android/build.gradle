// Root build file: only configure buildscript, load shared variables, and repositories
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

// Muat variabel shared untuk subprojek (compileSdkVersion, minSdkVersion, dsb.)
apply from: 'variables.gradle'

// Konfigurasi repositori yang akan digunakan oleh subprojects/modules
subprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs 'capacitor-cordova-android-plugins/src/main/libs', 'libs'
        }
    }
}